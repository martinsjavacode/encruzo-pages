<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Encruzo — onde os caminhos se cruzam">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#f5f5f7"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5ac8fa"/><stop offset="1" stop-color="#007aff"/>
    </linearGradient>
    <linearGradient id="p2" x1="100" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#007aff"/><stop offset="1" stop-color="#5856d6"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop stop-color="#ffcc00"/><stop offset="0.5" stop-color="#ff9500"/><stop offset="1" stop-color="#c93400"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#ff9500" stop-opacity="0.14"/><stop offset="0.6" stop-color="#007aff" stop-opacity="0.06"/><stop offset="1" stop-color="#f5f5f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="330" cy="315" r="360" fill="url(#glow)"/>

  <!-- Símbolo A, centralizado à esquerda -->
  <g transform="translate(210 175) scale(2.8)">
    <path d="M50 12 L50 42" stroke="url(#p1)" stroke-width="7" stroke-linecap="round"/>
    <path d="M50 58 L50 88" stroke="url(#p2)" stroke-width="7" stroke-linecap="round"/>
    <path d="M12 50 L42 50" stroke="url(#p2)" stroke-width="7" stroke-linecap="round"/>
    <path d="M58 50 L88 50" stroke="url(#p1)" stroke-width="7" stroke-linecap="round"/>
    <path d="M26 26 L38 38" stroke="#007aff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
    <path d="M74 74 L62 62" stroke="#007aff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
    <path d="M74 26 L62 38" stroke="#007aff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
    <path d="M26 74 L38 62" stroke="#007aff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="13" fill="url(#core)"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="600" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="128" font-weight="600" fill="#1d1d1f" letter-spacing="-1">Encruzo</text>
  <text x="604" y="366" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#86868b">onde os caminhos se cruzam</text>
  <rect x="604" y="398" width="72" height="4" rx="2" fill="#ff9500"/>
  <text x="604" y="452" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#636366">para quem atende, cuida e orienta</text>
</svg>
